spring:
  application:
    name: tap-service

  datasource:
    url: jdbc:postgresql://localhost:5432/devdb
    username: devuser
    password: devpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: tap-service
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: tap-service-test
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      enabled: true   # Java 21 virtual threads (safe default)

  cache:
    type: caffeine
    caffeine:
      # fare rules are tiny — cache forever, refresh hourly
      spec: maximumSize=100,expireAfterWrite=1h

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: tap-service
  info:
    env:
      enabled: true
    git:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

logging:
  level:
    org.springframework.web: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: error
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

info:
  app:
    name: Tap & Go API
    version: 1.0.0
    owner: GK Corp

app:
  ingestion:
    batch-size: 100
  processing:
    scheduler:
      fixed-delay-ms: 5000
      page-size: 100
      orphan-cutoff-minutes: 3