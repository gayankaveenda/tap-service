spring:
  application:
    name: tap-service

  datasource:
    url: jdbc:postgresql://localhost:5432/devdb
    username: devuser
    password: devpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        default_schema: tappay
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: tappay
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      enabled: true   # Java 21 virtual threads (safe default)

server:
  port: 8080
  servlet:
    context-path: /api

management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: tap-service
  info:
    env:
      enabled: true
    git:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

logging:
  level:
    org.springframework.web: INFO
    au.com.rdti.northstar: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

info:
  app:
    name: Tap & Go API
    version: 1.0.0
    owner: GK Corp
    ingestion:
      batch-size: 100